<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palpicop - Copa 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        h1 { text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.6); }
    </style>
</head>
<body id="main-body" class="font-sans min-h-screen flex flex-col items-center justify-center p-4 bg-cover bg-center bg-no-repeat bg-fixed text-base" style="background-image: linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.55)), url('fundo.png');">

    <audio id="bg-music" loop src="Goleada.mp3"></audio>
    <audio id="sound-click" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-84.wav"></audio>
    <audio id="sound-success" src="https://assets.mixkit.co/active_storage/sfx/2019/2019-84.wav"></audio>

    <div class="fixed top-2 right-2 left-2 sm:left-auto z-50 flex items-center justify-between sm:justify-end gap-1.5 bg-black/80 backdrop-blur-md p-2 rounded-lg shadow-lg border border-white/10">
        <div class="flex items-center gap-1">
            <button id="btn-adm-trigger" title="Painel do Professor" class="text-white bg-white/10 hover:bg-white/20 w-8 h-8 rounded flex items-center justify-center transition text-sm">⚙️</button>
            <div class="h-6 w-px bg-white/20 mx-1"></div>
            <button id="btn-font-dec" title="Diminuir Letra" class="text-white bg-white/10 hover:bg-white/20 w-8 h-8 rounded font-bold text-xs transition">A-</button>
            <button id="btn-font-inc" title="Aumentar Letra" class="text-white bg-white/10 hover:bg-white/20 w-8 h-8 rounded font-bold text-xs transition">A+</button>
        </div>
        <div class="flex items-center gap-1.5">
            <div class="h-6 w-px bg-white/20 mx-1 hidden sm:block"></div>
            <button id="music-btn" class="text-white bg-white/10 hover:bg-white/20 px-2.5 h-8 rounded text-xs font-semibold transition whitespace-nowrap">🎵 Som Desativado</button>
            <input id="volume-range" type="range" min="0" max="1" step="0.1" value="0.5" class="w-14 sm:w-16 accent-green-500 h-1 bg-white/30 rounded-lg appearance-none cursor-pointer">
        </div>
    </div>

    <header class="text-center mb-6 mt-14 sm:mt-0">
        <h1 class="text-4xl font-extrabold text-white tracking-wide drop-shadow-lg">🏆 Palpicop</h1>
        <p class="text-gray-200 mt-2 drop-shadow font-medium">Copa do Mundo 2026</p>
        <div class="mt-3 inline-block bg-green-600/90 text-white text-xs font-bold px-3 py-1.5 rounded-full shadow-md backdrop-blur-sm">
            🔥 <span id="total-palpites-counter">0</span> palpites enviados na rodada ativa!
        </div>
    </header>

    <div id="auth-section" class="bg-white/95 backdrop-blur-sm p-6 sm:p-8 rounded-lg shadow-xl w-full max-w-md border border-gray-100">
        <h2 class="text-xl font-bold mb-4 text-center text-gray-800">Acesse com seu e-mail da Escola</h2>
        <input type="email" id="email-input" placeholder="seu-nome@escola.pr.gov.br" class="w-full p-3 border border-gray-300 rounded mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-700 text-sm">
        <button id="login-btn" class="w-full bg-blue-600 text-white p-3 rounded font-bold hover:bg-blue-700 transition shadow-md text-sm">Entrar no Palpicop</button>
        <p id="auth-error" class="text-red-600 text-sm mt-2 text-center font-medium hidden"></p>
    </div>

    <div id="app-section" class="bg-white/95 backdrop-blur-sm p-6 sm:p-8 rounded-lg shadow-xl w-full max-w-2xl border border-gray-100 hidden">
        <div class="flex justify-between items-center mb-4 border-b pb-4">
            <span id="user-display" class="text-gray-700 font-semibold text-xs sm:text-sm truncate mr-2"></span>
            <button id="logout-btn" class="text-xs bg-red-500 text-white px-2.5 py-1.5 rounded font-bold hover:bg-red-600 transition shadow shrink-0">Sair</button>
        </div>
        
        <div class="mb-4 flex items-center justify-between bg-blue-50 p-2 rounded border border-blue-200">
            <label for="user-date-select" class="text-xs font-bold text-blue-800">📅 Consultar Rodada:</label>
            <select id="user-date-select" class="text-xs font-bold p-1.5 rounded border bg-white text-gray-700 focus:outline-none"></select>
        </div>

        <h3 class="text-base sm:text-lg font-bold mb-4 text-gray-800 text-center">Jogos da Rodada</h3>
        <div id="games-container" class="space-y-4"></div>
        <button id="save-palpites-btn" class="w-full mt-6 bg-green-600 text-white p-3 rounded font-bold hover:bg-green-700 transition shadow-md text-sm">Salvar Palpite Único</button>
        <p id="save-status" class="text-center mt-3 font-semibold text-sm"></p>
    </div>

    <div id="adm-section" class="bg-white/95 backdrop-blur-sm p-6 sm:p-8 rounded-lg shadow-xl w-full max-w-xl border border-gray-100 hidden">
        <div class="flex justify-between items-center mb-4 border-b pb-2">
            <h3 class="text-base sm:text-lg font-bold text-blue-800">🔐 Painel do Professor</h3>
            <button id="back-adm-btn" class="text-xs bg-gray-500 text-white px-2.5 py-1.5 rounded font-bold hover:bg-gray-600 transition shadow">Voltar</button>
        </div>
        
        <div id="adm-auth-box">
            <input type="password" id="adm-password-input" placeholder="Digite a Senha do Professor" class="w-full p-2.5 border rounded mb-3 text-center font-bold text-sm text-black">
            <button id="adm-login-btn" class="w-full bg-blue-700 text-white p-2.5 rounded font-bold text-sm">Acessar Painel</button>
            <p id="adm-auth-error" class="text-red-600 text-xs mt-1 text-center font-bold hidden">Senha Incorreta!</p>
        </div>

        <div id="adm-control-box" class="hidden space-y-6">
            
            <div class="bg-amber-50 p-3 rounded border border-amber-200 flex items-center justify-between">
                <label for="adm-date-select" class="text-xs font-bold text-amber-800">🛠️ Gerenciar Qual Rodada?</label>
                <select id="adm-date-select" class="text-xs font-bold p-1.5 rounded border bg-white text-black"></select>
            </div>

            <div>
                <h4 class="font-bold text-xs sm:text-sm text-gray-700 mb-2 border-b pb-1">⚽ Inserir Placares Reais</h4>
                <div id="adm-games-list" class="space-y-2 mb-3"></div>
                <button id="adm-save-btn" class="w-full bg-green-600 text-white p-2 rounded font-bold text-xs hover:bg-green-700 transition">Salvar Placares Oficiais</button>
                <p id="adm-save-status" class="text-center text-xs font-bold mt-1"></p>
            </div>

            <div class="border-t pt-4">
                <h4 class="font-bold text-xs sm:text-sm text-blue-800 mb-3 flex justify-between items-center">
                    <span>📊 Auditoria e Acertos dos Alunos</span>
                    <button id="view-results-btn" class="bg-blue-100 text-blue-700 text-xs px-2 py-1 rounded hover:bg-blue-200 transition font-bold">🔄 Carregar / Atualizar</button>
                </h4>
                <div id="results-container" class="space-y-4 max-h-60 overflow-y-auto pr-1">
                    <p class="text-xs text-gray-500 italic">Clique no botão acima para carregar a conferência da rodada selecionada.</p>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
