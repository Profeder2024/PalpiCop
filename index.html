<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palpicop - Copa 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="font-sans min-h-screen flex flex-col items-center justify-center p-4 bg-cover bg-center bg-no-repeat bg-fixed" style="background-image: linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.55)), url('fundo.png');">

    <header class="text-center mb-8">
        <h1 class="text-4xl font-extrabold text-white tracking-wide drop-shadow-lg">🏆 PalpiCop</h1>
        <p class="text-gray-200 mt-2 drop-shadow font-medium">Deixe seu palpite para os jogos da Copa do Mundo 2026</p>
    </header>

    <div id="auth-section" class="bg-white/95 backdrop-blur-sm p-8 rounded-lg shadow-xl w-full max-w-md border border-gray-100">
        <h2 class="text-xl font-bold mb-4 text-center text-gray-800">Acesse com seu e-mail da Escola</h2>
        <input type="email" id="email-input" placeholder="seu-nome@escola.pr.gov.br" class="w-full p-3 border border-gray-300 rounded mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-700">
        <button id="login-btn" class="w-full bg-blue-600 text-white p-3 rounded font-bold hover:bg-blue-700 transition shadow-md">Entrar no PalpiCop</button>
        <p id="auth-error" class="text-red-600 text-sm mt-2 text-center font-medium hidden"></p>
    </div>

    <div id="app-section" class="bg-white/95 backdrop-blur-sm p-8 rounded-lg shadow-xl w-full max-w-2xl border border-gray-100 hidden">
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <span id="user-display" class="text-gray-700 font-semibold text-sm"></span>
            <button id="logout-btn" class="text-xs bg-red-500 text-white px-3 py-1.5 rounded font-bold hover:bg-red-600 transition shadow">Sair</button>
        </div>

        <h3 class="text-lg font-bold mb-4 text-gray-800 text-center">Jogos do Dia</h3>
        
        <div id="games-container" class="space-y-4"></div>

        <button id="save-palpites-btn" class="w-full mt-6 bg-green-600 text-white p-3 rounded font-bold hover:bg-green-700 transition shadow-md">Salvar Palpite Único</button>
        <p id="save-status" class="text-center mt-3 font-semibold text-sm"></p>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
