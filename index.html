<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palpicop - Copa 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen flex flex-col items-center justify-center p-4">

    <header class="text-center mb-8">
        <h1 class="text-4xl font-extrabold text-blue-600 tracking-wide">🏆 Palpicop</h1>
        <p class="text-gray-600">Deixe seu palpite para os jogos da Copa do Mundo 2026</p>
    </header>

    <div id="auth-section" class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h2 class="text-xl font-bold mb-4 text-center text-gray-800">Acesse com seu e-mail da Escola</h2>
        <input type="email" id="email-input" placeholder="seu-nome@escola.com" class="w-full p-3 border border-gray-300 rounded mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <button id="login-btn" class="w-full bg-blue-600 text-white p-3 rounded font-bold hover:bg-blue-700 transition">Entrar no Palpicop</button>
        <p id="auth-error" class="text-red-500 text-sm mt-2 hidden"></p>
    </div>

    <div id="app-section" class="bg-white p-8 rounded-lg shadow-md w-full max-w-2xl hidden">
        <div class="flex justify-between items-center mb-6">
            <span id="user-display" class="text-gray-700 font-medium"></span>
            <button id="logout-btn" class="text-sm bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600">Sair</button>
        </div>

        <h3 class="text-lg font-bold mb-4 text-gray-800 text-center">Jogos do Dia</h3>
        
        <div id="games-container" class="space-y-6"></div>

        <button id="save-palpites-btn" class="w-full mt-6 bg-green-600 text-white p-3 rounded font-bold hover:bg-green-700 transition">Salvar Palpite Único</button>
        <p id="save-status" class="text-center mt-2 font-medium"></p>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
